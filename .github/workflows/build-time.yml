name: build-time

# Times a clean `lake build` of MachLib foundations on every push to
# master, writes the wall-time to `.github/build-time.json`, and
# commits the JSON back to master so the README badge reads from raw.
# githubusercontent.com without manual intervention.
#
# The headline "X-second cold build" claim on machlib.org is the
# value this workflow stamps. Re-anchoring it requires no human in
# the loop -- only that the workflow run succeed.

on:
  push:
    branches: [master]
    paths:
      - "foundations/**"
      - "lean-toolchain"
      - ".github/workflows/build-time.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so the auto-commit step can push.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve toolchain pin
        working-directory: foundations
        run: |
          cat lean-toolchain
          lake --version || true
          lean --version

      - name: Cold lake build (timed)
        id: cold_build
        working-directory: foundations
        run: |
          rm -rf .lake
          # /usr/bin/time -f produces "elapsed=X.XX" on a single line
          # we then parse to seconds. `lake build` exit code is what
          # decides workflow success/failure.
          start=$(date +%s.%N)
          lake build
          end=$(date +%s.%N)
          seconds=$(awk "BEGIN { printf \"%.2f\", $end - $start }")
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Cold build wall-time: ${seconds}s"

      # `lake build` only builds MachLib.lean + its transitive imports.
      # This static check fails if a foundation module is reachable from
      # nothing (and so never built / gated) — closing the "module exists
      # but CI never sees it" hole. Static transitive closure from MachLib.lean;
      # no compilation. Being imported by a sibling is NOT reachability.
      - name: Aggregator completeness (no ungated orphan modules)
        working-directory: foundations
        run: bash scripts/check_aggregator.sh

      # The flagship axiom closure is proved consistent by an ℤ-model
      # (`MachLib.Model.intModel`). That argument only holds if the model is a
      # genuine EXTERNAL one — depending on none of MachLib's own axioms. This
      # gate re-derives `#print axioms intModel` and fails if ANY non-core axiom
      # appears (allowlist = Lean's trust base). The old check grepped only for
      # `MachLib.Real`, which missed Certcom.* and MachLib.analytic_*.
      - name: Consistency model (flagship closure has an external ℤ-model)
        working-directory: foundations
        run: bash scripts/check_consistency_model.sh

      # MachLib/Discovered/ (294 self-contained Forge @verify files, ~749
      # theorems) cannot be imported together, so it is outside the aggregator
      # cone — and was therefore outside EVERY automated check: not built by
      # `lake build`, invisible to `sorry_audit` (which walks the environment),
      # excluded by `check_aggregator`, and `closerate.sh` is a measurement
      # harness CI does not run. This is the minimum honest guard: every file
      # still compiles. ~46 s at -P6. Four known-broken files are allow-listed
      # with their errors (Forge-generated; fix the generator).
      - name: Discovered corpus compiles (Forge @verify files, outside the aggregator)
        working-directory: foundations
        run: bash scripts/check_discovered_compiles.sh 4

      # Every headline "proven / unconditional / Rolle-only" claim in the
      # CHANGELOG/README is pinned to the REAL `#print axioms` footprint of the
      # theorem it cites (tools/claim_audit/claims.json). Fails if a claim
      # outruns its footprint — e.g. the pure iterated-exp explicit bound
      # silently gaining an analyticity / log / reciprocal axiom (it must stay
      # Rolle-only), or the mixed EML barrier bound regressing to `sorryAx` or
      # the classical zero-count escape hatch. The pair of entries pins the
      # honest distinction between the two results.
      # AxiomLedger.lean IS the trust gate (per its own docstring) but had
      # NO CI coverage before 2026-07-16 -- it sat red locally for ~3 days
      # (15 undisclosed axioms from the BivariateDeriv + TwoExp Gate-2d
      # frontier work, 3 rotted entries from axioms that got proven/deleted)
      # with nothing to catch it. Building it here enforces all 4 invariants
      # a red run means: an axiom entered the codebase undisclosed, a ledger
      # entry rotted, a headline's footprint leaked beyond `trustedFootprint`,
      # or a `disclosedUnwitnessed`/`disclosedTrusted` axiom stopped being inert
      # or went dead. `run_cmd`'s `logError` makes `lake env lean` exit
      # non-zero on any violation, so no `|| true` here.
      - name: Axiom ledger (trust-boundary completeness + footprint)
        working-directory: foundations
        run: lake env lean AxiomLedger.lean

      - name: Claim audit (headline prose ↔ #print axioms footprint)
        working-directory: foundations
        run: python3 tools/claim_audit/claim_audit.py

      # The claim auditor pins prose to a theorem's axiom footprint. It cannot see
      # a claim about a theorem that does not exist — including the claim "this
      # obligation is still open". EMLDepthTameness ends with a ledger of named
      # obligations; "discharged" rows were checkable (the theorem is cited), but
      # "open" rows were pure assertion, so discharging an obligation and forgetting
      # its row failed nothing. This gate checks both directions against the corpus:
      # an "open" row with a theorem concluding it is STALE, a "discharged" row whose
      # cited theorem does not conclude it is BROKEN. Exit 2 = ledger unreadable
      # (UNAVAILABLE, deliberately distinct from a pass). The same table is duplicated in
      # CHANGELOG.md -- and that copy is the one that went stale first, saying "Four
      # propositions" over four rows after a fifth was added -- so both are parsed and must
      # agree. Canary self-test included: four convict specimens must fire (row mislabelled
      # open, row mislabelled discharged, row missing from the changelog copy, status
      # disagreeing across copies) and correct rows must stay silent, so the gate cannot be
      # satisfied by a checker that simply fails everything.
      - name: Obligations ledger (open/discharged rows ↔ the corpus)
        working-directory: foundations
        run: bash tools/check_obligations.sh

      - name: Write build-time badge JSON
        env:
          BUILD_SECONDS: ${{ steps.cold_build.outputs.seconds }}
        run: |
          mkdir -p .github
          # shields.io endpoint badge schema:
          # https://shields.io/badges/endpoint-badge
          # color is "brightgreen" up to 6s, "yellow" 6-15s, "red" beyond.
          color=$(awk -v s="$BUILD_SECONDS" \
            'BEGIN { if (s <= 6.0) print "brightgreen"; \
                     else if (s <= 15.0) print "yellow"; \
                     else print "red" }')
          export COLOR="$color"
          python3 -c "import json,os; print(json.dumps({'schemaVersion':1,'label':'cold build','message':f\"{os.environ['BUILD_SECONDS']}s\",'color':os.environ['COLOR'],'cacheSeconds':300}, indent=2))" \
            > .github/build-time.json
          cat .github/build-time.json

      - name: Commit + push the badge JSON
        env:
          BUILD_SECONDS: ${{ steps.cold_build.outputs.seconds }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .github/build-time.json; then
            echo "build-time.json unchanged; skipping commit."
            exit 0
          fi
          git add .github/build-time.json
          git commit -m "ci(build-time): refresh cold-build badge to ${BUILD_SECONDS}s [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5) -- another commit landed on master while this run was building, rebasing and retrying"
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::failed to push the badge JSON after 5 rebase-retry attempts"
          exit 1
